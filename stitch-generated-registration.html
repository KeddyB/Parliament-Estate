<h2 class="font-display-lg text-display-lg md:text-display-lg text-on-surface dark:text-on-surface mb-sm">Join the Estate</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant dark:text-outline max-w-xl mx-auto">Access the exclusive member portal and manage your residence within Parliament Estate.</p>
</header>
<!-- Registration Form Card -->
<section class="w-full max-w-[640px] px-margin-mobile">
<div class="bg-surface dark:bg-surface-container-lowest border border-outline-variant dark:border-outline p-lg md:p-xl">
<form class="space-y-lg" onsubmit="event.preventDefault(); alert('Registration submitted');">
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant dark:text-outline">Full Name</label>
<input class="bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md transition-all" placeholder="John Doe" required="" type="text"/>
</div>
<!-- Landlord Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant dark:text-outline flex justify-between">
                                Landlord Name
                                <span class="font-normal lowercase opacity-60">(optional)</span>
</label>
<input class="bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md transition-all" placeholder="Estate Management" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-lg">
<!-- Road Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant dark:text-outline">Road Number</label>
<select class="bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md transition-all appearance-none cursor-pointer" required="">
<option disabled="" selected="" value="">Select</option>
<option>Road 1</option>
<option>Road 2</option>
<option>Road 3</option>
<option>Road 4</option>
<option>Road 5</option>
<option>Road 6</option>
<option>Road 7</option>
<option>Road 8</option>
<option>Road 9</option>
<option>Road 10</option>
<option>Road 11</option>
<option>Road 12</option>
</select>
</div>
<!-- House Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant dark:text-outline">House Number</label>
<input class="bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md transition-all" placeholder="10A" required="" type="text"/>
</div>
<!-- Close -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant dark:text-outline flex justify-between">
                                Close No.
                                <span class="font-normal lowercase opacity-60">(opt)</span>
</label>
<input class="bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md transition-all" placeholder="4" type="text"/>
</div>
</div>
<!-- Contact Info -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant dark:text-outline">Email Address</label>
<input class="bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md transition-all" placeholder="resident@parliament.est" required="" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant dark:text-outline">Phone Number</label>
<input class="bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md transition-all" placeholder="+44 20 7946 0000" required="" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant dark:text-outline">Password</label>
<input class="bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md transition-all" placeholder="••••••••••••" required="" type="password"/>
</div>
<!-- Submit -->
<div class="pt-md">
<button class="w-full bg-primary text-on-primary py-md font-label-md text-label-md uppercase tracking-widest hover:bg-on-primary-fixed transition-all duration-200 active:scale-[0.98]" type="submit">
                            Complete Registration
                        </button>
</div>

<script>
        // Micro-interaction for form inputs
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('opacity-100');
            });
            input.addEventListener('blur', () => {
                if (!input.value) {
                    input.parentElement.classList.remove('opacity-100');
                }
            });
        });
    </script>
